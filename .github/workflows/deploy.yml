name: Deploy and Test

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --prefix front

      - name: Build front
        run: npm run build --prefix front

      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}

      - name: Wait for deployment to be live
        uses: jakejarvis/wait-action@v1
        with:
          url: "https://akapo-front.vercel.app"

      - name: Install Cypress
        run: npm install --prefix front cypress --save-dev

      - name: Run Cypress tests
        run: npx cypress run
        working-directory: ./front
        env:
          CYPRESS_BASE_URL: https://akapo-front.vercel.app
